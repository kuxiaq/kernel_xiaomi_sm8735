name: Build Kernel with KernelSU Next + SUSFS + NoMount + AnyKernel3

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Defconfig name (e.g., onyx_perf.config, gki_defconfig)'
        required: true
        default: 'onyx_perf.config'
      build_target:
        description: 'Bazel build target (e.g., //... or //kernel:Image)'
        required: true
        default: '//...'
      kernel_image_path:
        description: 'Path to the kernel image relative to kernel/ (e.g., out/arch/arm64/boot/Image.gz-dtb)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: kuxiaq/kernel_xiaomi_sm8735
          ref: oss
          path: kernel

      - name: Checkout KernelSU Next
        uses: actions/checkout@v4
        with:
          repository: KernelSU-Next/KernelSU-Next
          path: KernelSU-Next

      - name: Checkout SUSFS (Android 15 / 6.6)
        uses: actions/checkout@v4
        with:
          repository: simonpunk/susfs4ksu
          ref: gki-android15-6.6
          path: susfs4ksu

      - name: Checkout NoMount
        uses: actions/checkout@v4
        with:
          repository: maxsteeel/nomount
          path: nomount

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y git make gcc clang lld bc bison flex libssl-dev \
            libelf-dev ccache ninja-build bazel

      - name: Apply KernelSU Next
        working-directory: kernel
        run: |
          cp -r ../KernelSU-Next/kernel/* .

      - name: Apply SUSFS Patches
        working-directory: kernel
        run: |
          cp ../susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp ../susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          patch -p1 < ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel.patch || echo "SUSFS patch failed"
          if [ -f "../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" ]; then
            patch -p1 < ../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch || echo "KSU patch failed"
          fi

      - name: Apply NoMount Patches
        working-directory: kernel
        run: |
          for patch in ../nomount/*.patch; do
            if [ -f "$patch" ]; then
              echo "Applying $patch"
              patch -p1 < "$patch" || echo "Patch $patch failed"
            fi
          done
          # Fallback: copy source files if no patches
          if ! ls ../nomount/*.patch 1> /dev/null 2>&1; then
            echo "No patch files, copying source files from nomount"
            cp -r ../nomount/* . 2>/dev/null || true
          fi

      - name: Configure Kernel
        working-directory: kernel
        run: |
          DEFCONFIG="${{ github.event.inputs.defconfig }}"
          if [ -f "arch/arm64/configs/vendor/$DEFCONFIG" ]; then
            CONFIG_PATH="arch/arm64/configs/vendor/$DEFCONFIG"
          elif [ -f "arch/arm64/configs/$DEFCONFIG" ]; then
            CONFIG_PATH="arch/arm64/configs/$DEFCONFIG"
          else
            echo "Defconfig not found! Check the name."
            exit 1
          fi
          echo "CONFIG_KSU=y" >> "$CONFIG_PATH"
          echo "CONFIG_KSU_SUSFS=y" >> "$CONFIG_PATH"
          echo "CONFIG_NOMOUNT=y" >> "$CONFIG_PATH" 2>/dev/null || true

      - name: Build with Bazel
        working-directory: kernel
        run: |
          bazel build ${{ github.event.inputs.build_target }} --config=fast --config=stamp

      - name: Locate Kernel Image
        id: locate_kernel
        working-directory: kernel
        run: |
          # If user provided explicit path, use it
          if [ -n "${{ github.event.inputs.kernel_image_path }}" ]; then
            IMAGE="${{ github.event.inputs.kernel_image_path }}"
            if [ -f "$IMAGE" ]; then
              echo "image_path=$IMAGE" >> $GITHUB_OUTPUT
              echo "Found: $IMAGE"
              exit 0
            fi
          fi

          # Auto-detect common paths
          CANDIDATES=(
            "out/arch/arm64/boot/Image.gz-dtb"
            "out/arch/arm64/boot/Image.gz"
            "out/arch/arm64/boot/Image"
            "bazel-bin/arch/arm64/boot/Image.gz-dtb"
            "bazel-bin/arch/arm64/boot/Image.gz"
            "bazel-bin/arch/arm64/boot/Image"
          )
          for candidate in "${CANDIDATES[@]}"; do
            if [ -f "$candidate" ]; then
              echo "image_path=$candidate" >> $GITHUB_OUTPUT
              echo "Found: $candidate"
              exit 0
            fi
          done

          echo "No kernel image found! Check your build output."
          exit 1

      - name: Prepare AnyKernel3
        uses: actions/checkout@v4
        with:
          repository: osm0sis/AnyKernel3
          path: AnyKernel3

      - name: Package Kernel with AnyKernel3
        working-directory: kernel
        run: |
          # Copy kernel image to AnyKernel3 root with the expected name
          IMAGE="${{ steps.locate_kernel.outputs.image_path }}"
          cp "$IMAGE" ../AnyKernel3/Image.gz-dtb

          # Optionally copy any dtb if needed (not required for most)
          # cp some/dtb ../AnyKernel3/dtb

          # Copy any additional files (modules) if desired
          # find out/ -name "*.ko" -exec cp {} ../AnyKernel3/modules/ \;

      - name: Create AnyKernel3 ZIP
        working-directory: AnyKernel3
        run: |
          # Remove .git to keep the zip clean
          rm -rf .git
          # Create zip
          zip -r9 AnyKernel3.zip * -x "*.zip" -x "*.git*"
          # Move to a known location for upload
          mv AnyKernel3.zip ../kernel/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-flashable
          path: kernel/AnyKernel3.zip
