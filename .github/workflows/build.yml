name: Build Kernel with KernelSU Next + SUSFS + NoMount + AnyKernel3

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Defconfig name (e.g., onyx_perf.config, gki_defconfig)'
        required: true
        default: 'onyx_perf.config'
      build_target:
        description: 'Bazel build target'
        required: true
        default: '//...'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: kuxiaq/kernel_xiaomi_sm8735
          ref: oss
          path: kernel

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y git make gcc clang lld bc bison flex libssl-dev \
            libelf-dev ccache ninja-build curl
          # Install Bazelisk as bazel
          wget https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          chmod +x bazelisk-linux-amd64
          sudo mv bazelisk-linux-amd64 /usr/local/bin/bazel
          bazel --version

      # ------------------------------------------------------------
      # 1. Integrate KernelSU Next using its official script
      # ------------------------------------------------------------
      - name: Integrate KernelSU Next
        working-directory: kernel
        run: |
          # Use KernelSU Next's recommended integration script
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s -- --yes
          # If the script fails, fallback to manual copy (optional)
          if [ $? -ne 0 ]; then
            echo "Script failed, falling back to manual copy"
            git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next ../KernelSU-Next
            cp -r ../KernelSU-Next/kernel/* .
          fi

      # ------------------------------------------------------------
      # 2. Apply SUSFS (local patches)
      # ------------------------------------------------------------
      - name: Apply SUSFS Patches
        working-directory: kernel
        run: |
          if [ -d "susfs" ]; then
            cp susfs/fs/susfs.c fs/
            cp susfs/include/linux/susfs.h include/linux/
            cp susfs/include/linux/susfs_def.h include/linux/
            patch -p1 -N < susfs/50_add_susfs_in_kernel.patch || echo "Patch already applied or failed"
            if [ -f "susfs/KernelSU/10_enable_susfs_for_ksu.patch" ]; then
              patch -p1 -N < susfs/KernelSU/10_enable_susfs_for_ksu.patch || echo "KSU patch already applied or failed"
            fi
          else
            echo "WARNING: susfs/ folder not found, skipping SUSFS"
          fi

      # ------------------------------------------------------------
      # 3. Apply NoMount (local patches/source)
      # ------------------------------------------------------------
      - name: Apply NoMount Patches
        working-directory: kernel
        run: |
          if [ -d "nomount" ]; then
            for patch in nomount/*.patch; do
              if [ -f "$patch" ]; then
                patch -p1 -N < "$patch" || echo "Patch $patch already applied or failed"
              fi
            done
            if ! ls nomount/*.patch 1> /dev/null 2>&1; then
              cp -r nomount/* . 2>/dev/null || true
            fi
          else
            echo "WARNING: nomount/ folder not found, skipping NoMount"
          fi

      # ------------------------------------------------------------
      # 4. Configure Kernel (enable features)
      # ------------------------------------------------------------
      - name: Configure Kernel
        working-directory: kernel
        run: |
          DEFCONFIG="${{ github.event.inputs.defconfig }}"
          if [ -f "arch/arm64/configs/vendor/$DEFCONFIG" ]; then
            CONFIG_PATH="arch/arm64/configs/vendor/$DEFCONFIG"
          elif [ -f "arch/arm64/configs/$DEFCONFIG" ]; then
            CONFIG_PATH="arch/arm64/configs/$DEFCONFIG"
          else
            echo "Defconfig not found!"
            exit 1
          fi
          echo "CONFIG_KSU=y" >> "$CONFIG_PATH"
          echo "CONFIG_KSU_SUSFS=y" >> "$CONFIG_PATH"
          echo "CONFIG_NOMOUNT=y" >> "$CONFIG_PATH" 2>/dev/null || true

      # ------------------------------------------------------------
      # 5. Build with Bazel
      # ------------------------------------------------------------
      - name: Build with Bazel
        working-directory: kernel
        run: |
          bazel build ${{ github.event.inputs.build_target }} --config=fast --config=stamp

      # ------------------------------------------------------------
      # 6. Locate Kernel Image
      # ------------------------------------------------------------
      - name: Locate Kernel Image
        id: locate_kernel
        working-directory: kernel
        run: |
          CANDIDATES=(
            "out/arch/arm64/boot/Image.gz-dtb"
            "out/arch/arm64/boot/Image.gz"
            "out/arch/arm64/boot/Image"
            "bazel-bin/arch/arm64/boot/Image.gz-dtb"
            "bazel-bin/arch/arm64/boot/Image.gz"
            "bazel-bin/arch/arm64/boot/Image"
          )
          for candidate in "${CANDIDATES[@]}"; do
            if [ -f "$candidate" ]; then
              echo "image_path=$candidate" >> $GITHUB_OUTPUT
              echo "Found: $candidate"
              exit 0
            fi
          done
          echo "No kernel image found!"
          exit 1

      # ------------------------------------------------------------
      # 7. Package with Local AnyKernel3
      # ------------------------------------------------------------
      - name: Package with AnyKernel3
        working-directory: kernel
        run: |
          if [ ! -d "anykernel3" ]; then
            echo "ERROR: anykernel3/ folder not found!"
            exit 1
          fi
          IMAGE="${{ steps.locate_kernel.outputs.image_path }}"
          cp "$IMAGE" anykernel3/Image.gz-dtb
          cd anykernel3
          rm -rf .git .github
          zip -r9 AnyKernel3.zip * -x "*.zip"
          cd ..
          mv anykernel3/AnyKernel3.zip .

      # ------------------------------------------------------------
      # 8. Upload Flashable ZIP
      # ------------------------------------------------------------
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-flashable-onyx
          path: kernel/AnyKernel3.zip